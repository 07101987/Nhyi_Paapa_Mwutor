<body>
  <main>
    <h1>Refreshing App</h1>
    <p id="status">Clearing the old offline copy so the clean version can load.</p>
    <a href="index.html?v=20260723-writing-subject-view">Open App</a>
  </main>
  <script>
    async function resetAppCache() {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }

        document.getElementById("status").textContent = "Done. Opening the clean version now.";
      } catch (error) {
        document.getElementById("status").textContent = "Cache reset finished. Open the app again.";
      }

      setTimeout(() => {
        window.location.href = "index.html?v=20260723-writing-subject-view";
      }, 900);
    }

    resetAppCache();
  </script>
</body>
